[project]
name = "asian-worker"
version = "1.0.0"
description = "FastAPI worker service (Track 3) for the asian monorepo."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "redis>=5.1.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.31.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

# No [build-system]: this is an application, not an installable package.
# `uv sync` therefore resolves/installs dependencies only, which is what
# the Track 3 packages assume.

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]
fix = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "C90", # mccabe complexity
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # debugger calls
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking (formerly TCH)
]
ignore = [
    # COM812 conflicts with the ruff formatter; the formatter owns trailing commas.
    "COM812",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

# Coverage flags (--cov=app --cov-report=term-missing --cov-report=xml
# --cov-fail-under=90 per PY-004/PY-099) intentionally NOT set yet: the
# current suite covers the scaffold only, so a 90% branch gate would fail
# before the other Track 3 domains land their code and tests. Wire the
# gate in with PY-099.

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*"]
ignore_missing_imports = true
