name: iOS CI

# No `paths:` filter on the trigger — same reasoning as android-ci.yml:
# this is a required status check, and a path-filtered trigger means the
# workflow never runs (not even "skipped") on PRs that don't touch
# apps/ios, which blocks merging anything else forever. The workflow
# always runs; the first step decides whether to do real work.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (Swift 6.2, iOS Simulator)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether apps/ios changed
        id: changed
        working-directory: .
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No usable base SHA — assuming relevant." >&2
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" -- apps/ios .github/workflows/ios-ci.yml | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No apps/ios changes — skipping
        if: steps.changed.outputs.relevant != 'true'
        run: echo "Nothing under apps/ios changed in this diff."

      - name: Select an Xcode 16.x (Swift 6.2+) install
        if: steps.changed.outputs.relevant == 'true'
        run: |
          # Runner images ship several Xcode versions under exact, version-pinned
          # bundle names (Xcode_16.2.app, Xcode_16.3.app, ...) that drift over time
          # and differ per image — hardcoding one exact name breaks the moment the
          # image updates. Pick the newest 16.x actually present instead.
          candidate=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$candidate" ]; then
            echo "No Xcode 16.x found on this runner. Available:" >&2
            ls /Applications | grep -i xcode >&2
            exit 1
          fi
          echo "Selecting $candidate"
          sudo xcode-select -s "$candidate/Contents/Developer"

      - if: steps.changed.outputs.relevant == 'true'
        run: swift --version

      - name: Install XcodeGen
        if: steps.changed.outputs.relevant == 'true'
        run: brew install xcodegen

      - if: steps.changed.outputs.relevant == 'true'
        run: xcodegen generate

      - name: Build (iOS Simulator)
        if: steps.changed.outputs.relevant == 'true'
        run: |
          xcodebuild -scheme Asian -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Pick an available iOS Simulator device
        id: sim
        if: steps.changed.outputs.relevant == 'true'
        run: |
          # Same drift problem as the Xcode version: hardcoding a device name
          # (e.g. "iPhone 16") assumes it's pre-provisioned on this runner image,
          # which isn't guaranteed. Ask the installed Xcode what's actually there.
          # (A multi-line embedded python3 heredoc here previously tripped up
          # prettier's YAML parser with "Implicit keys need to be on a single
          # line" — jq as a single-line filter avoids the whole problem.)
          device=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable)][0].name // empty
          ')
          if [ -z "$device" ]; then
            echo "No available iOS Simulator device found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $device"
          echo "device=$device" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.changed.outputs.relevant == 'true'
        run: |
          xcodebuild -scheme Asian \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            test
