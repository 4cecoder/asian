# Production worker Deployment (Phase 3 image from apps/worker/Dockerfile).
#
# Pod template carries the plain `app: lingo-worker` label because the base
# NetworkPolicies (02-allow-ingress-to-worker, 03-allow-frontend-to-worker,
# 04-allow-worker-egress-external-https) select on exactly that key/value.
#
# Probes map to the FastAPI routes in apps/worker/app/routers/health.py:
#   startupProbe  -> /livez   (503 until lifespan warmup finishes)
#   readinessProbe -> /readyz  (503 while dependency checks fail)
#   livenessProbe  -> /healthz (shallow, no dependency calls — safe to
#                               restart on; /livez would be wrong here
#                               because it gates startup, not steady state)
#
# The runtime image runs as uid/gid 10001 non-root; the pod-level context
# below additionally satisfies the lingo-prod restricted Pod Security
# Standard enforced by the namespace labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lingo-worker
  labels:
    app.kubernetes.io/name: lingo-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lingo-worker
  template:
    metadata:
      labels:
        # Selected by the base NetworkPolicies — do not rename.
        app: lingo-worker
        app.kubernetes.io/name: lingo-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: lingo-worker-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Tag is pinned by the kustomization `images:` block — never put
          # a mutable tag here.
          image: ghcr.io/4cecoder/asian/lingo-worker
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            # Human-created in docs/knowledge/runbooks/prod-cutover.md:
            # ENVIRONMENT, SECURITY__SECRET_KEY, CONVEX__BASE_URL,
            # CONVEX__WORKER_SECRET. Never bake values into this manifest.
            - secretRef:
                name: lingo-worker-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # uvicorn/stdlib need a writable tmp; everything else stays
            # read-only with the root filesystem locked down above.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 24 # ~2 min warmup budget before liveness takes over
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
