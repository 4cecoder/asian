# Namespace-local copy of infra/k8s/base/rbac/sa-worker.yaml. The base
# file has no metadata.namespace, so `kubectl apply -k infra/k8s/base/rbac`
# puts the ServiceAccount in whatever namespace is current — fine for
# ad-hoc staging use, wrong for prod. Including a copy here lets the
# kustomization's `namespace:` field place it in lingo-prod, where the
# Deployment references it. Keep the name identical to the base SA so the
# RoleBinding subject pattern stays valid if RBAC gets namespace-scoped
# copies later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lingo-worker-sa
  labels:
    app.kubernetes.io/name: lingo-worker
    app.kubernetes.io/component: worker
automountServiceAccountToken: false
