apiVersion: v1
kind: LimitRange
metadata:
  name: lingo-staging-limits
  namespace: lingo-staging
  labels:
    app.kubernetes.io/part-of: lingo-platform
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 512Mi
      max:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 10Gi
      min:
        cpu: 25m
        memory: 32Mi
        ephemeral-storage: 128Mi
